<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Montaj Formu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 16px/1.4 Roboto, -apple-system, "Segoe UI", Arial, sans-serif; background: #f1f3f6; color: #1f2937; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, textarea { font: inherit; font-size: 16px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; width: 100%; color: inherit; }
  input:focus, textarea:focus { outline: 2px solid #e8590c; outline-offset: -1px; }
  nav { display: flex; background: #1f2937; position: sticky; top: 0; z-index: 6; padding-top: env(safe-area-inset-top); }
  nav button { flex: 1; background: none; color: #94a3b8; border: 0; padding: 14px 4px; font-weight: 600; border-bottom: 3px solid transparent; }
  nav button.on { color: #fff; border-bottom-color: #e8590c; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }

  .head { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .head input { flex: 1; }
  .head button { padding: 10px 12px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; white-space: nowrap; }

  .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; color: #64748b; font-size: 14px; }
  .card-top button { border: 0; background: none; color: #dc2626; padding: 6px 8px; font-size: 14px; }
  .f { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .f label { display: block; font-size: 13px; color: #64748b; }
  .f label input { margin-top: 3px; }
  .f .full { grid-column: 1 / -1; }
  .code-wrap { position: relative; display: grid; grid-template-columns: 90px 1fr; gap: 10px; grid-column: 1 / -1; }
  .who { width: 100%; margin-top: 3px; min-height: 44px; text-align: left; padding: 10px; border: 1px dashed #94a3b8; background: #f8fafc; border-radius: 8px; }
  .who:empty::before { content: "Kişi seç…"; color: #94a3b8; }
  .seg { display: flex; margin-top: 3px; }
  .seg button { flex: 1; padding: 10px 0; border: 1px solid #cbd5e1; background: #fff; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  .seg button.on[data-v=Evet] { background: #16a34a; border-color: #16a34a; color: #fff; }
  .seg button.on[data-v=Hayır] { background: #dc2626; border-color: #dc2626; color: #fff; }

  /* ürün seçme listesi */
  #dd { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; margin: 4px 0 0; padding: 0; list-style: none; background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 280px; overflow-y: auto; overscroll-behavior: contain; }
  #dd li { display: flex; gap: 10px; align-items: baseline; padding: 13px 12px; border-bottom: 1px solid #eef0f3; }
  #dd li:active { background: #fff1e8; }
  #dd li b { min-width: 44px; color: #e8590c; }
  #dd li.empty { color: #94a3b8; }

  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #e2e8f0; }
  .bottom button { flex: 1; padding: 14px 0; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff; font-weight: 600; }
  .bottom .main { background: #e8590c; border-color: #e8590c; color: #fff; }
  .bottom button:disabled { opacity: .6; }

  .add { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; display: grid; gap: 10px; }
  .add .two { display: grid; grid-template-columns: 90px 1fr; gap: 10px; }
  .add button { padding: 12px; border: 0; border-radius: 8px; background: #e8590c; color: #fff; font-weight: 600; }
  .add button:disabled { opacity: .6; }
  ul.list { list-style: none; padding: 0; margin: 0; background: #fff; border-radius: 12px; overflow: hidden; }
  ul.list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid #eef0f3; }
  ul.list li button { border: 0; background: none; color: #dc2626; padding: 6px 10px; }

  dialog { border: 0; border-radius: 14px; padding: 16px; width: min(400px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog label { display: flex; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid #eef0f3; }
  dialog label input { width: 22px; height: 22px; flex: none; }
  #pickList { max-height: 60vh; overflow-y: auto; margin-top: 8px; }
  dialog .btns { display: flex; gap: 8px; margin-top: 12px; }
  dialog .btns button { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; }
  dialog .btns button[value=ok] { background: #e8590c; border-color: #e8590c; color: #fff; font-weight: 600; }

  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 9; background: #1f2937; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; max-width: 90vw; text-align: center; transition: opacity .2s; }
  #toast[hidden] { display: block; opacity: 0; pointer-events: none; }

  /* Çıktı (PDF + yazdır) — kağıttaki form düzeni */
  .sheet { width: 194mm; font: 8pt/1.25 Arial, Helvetica, sans-serif; color: #000; background: #fff; }
  .sheet h1 { font-size: 12pt; font-weight: normal; text-align: center; margin: 0 0 3mm; }
  .sheet h1 span { color: #e8590c; font-weight: bold; margin-left: 4mm; }
  .sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .sheet th, .sheet td { border: 1px solid #000; padding: 1mm; overflow-wrap: break-word; vertical-align: middle; }
  .sheet th { font-size: 7.5pt; text-align: center; }
  .sheet td { height: 9mm; }
  .sheet td.eh { font-size: 7pt; white-space: nowrap; }
  .sheet .cb { display: inline-block; width: 2.6mm; height: 2.6mm; border: 1px solid #000; margin-right: .8mm; font-size: 6pt; line-height: 2.4mm; text-align: center; vertical-align: middle; }
  .sheet tr { page-break-inside: avoid; }
  .sheet .note { margin: 3mm 0 0; min-height: 6mm; font-size: 10pt; }
  #print { display: none; }
  @page { size: A4 portrait; margin: 8mm; }
  @media print {
    body { background: #fff; padding: 0; }
    body > *:not(#print) { display: none !important; }
    #print { display: block; }
  }
</style>
</head>
<body>
<nav>
  <button data-tab="form" class="on">Form</button>
  <button data-tab="people">Kişiler</button>
  <button data-tab="products">Ürünler</button>
</nav>

<main>
  <section id="form">
    <div class="head">
      <input type="date" id="date">
      <button id="printBtn">Yazdır</button>
      <button id="clear">Yeni Form</button>
    </div>
    <div id="rows"></div>
    <div class="card"><textarea id="note" rows="2" placeholder="NOT"></textarea></div>
  </section>

  <section id="people" hidden>
    <form class="add" id="personForm">
      <textarea name="v" rows="3" placeholder="Kişi adı (birden fazla kişi için her satıra bir isim)" required></textarea>
      <button>Kişi Ekle</button>
    </form>
    <ul class="list" id="personList"></ul>
  </section>

  <section id="products" hidden>
    <form class="add" id="productForm">
      <div class="two">
        <input name="code" placeholder="Kod" inputmode="numeric" autocomplete="off" required>
        <input name="pname" placeholder="Ürün adı" autocomplete="off" required>
      </div>
      <button>Ürün Ekle</button>
    </form>
    <ul class="list" id="productList"></ul>
  </section>
</main>

<div class="bottom" id="bottom">
  <button id="addRow">+ Satır</button>
  <button id="pdf" class="main">PDF İndir</button>
</div>

<dialog id="pick">
  <form method="dialog">
    <strong>Kişi seç</strong>
    <div id="pickList"></div>
    <div class="btns"><button value="cancel">Vazgeç</button><button value="ok">Tamam</button></div>
  </form>
</dialog>

<div id="toast" hidden></div>
<div id="print"></div>

<script>
const $ = s => document.querySelector(s);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lower = s => String(s).toLocaleLowerCase('tr');
const today = () => new Date().toLocaleDateString('sv'); // yerel saatle YYYY-MM-DD
const trDate = d => d ? d.split('-').reverse().join('.') : '';
let toastT;
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2500); };

// [alan, başlık, giriş tipi, çıktıdaki genişlik mm]  — Kişi kolonu 20mm, toplam 194mm (A4 - kenar)
const COLS = [
  ['code', 'Ürün kodu', 'numeric', 11],
  ['name', 'Ürün adı', 'text', 32],
  ['ok', 'Sağlam Ürün Adeti', 'numeric', 14],
  ['sort', '%100 Ayıklama', 'eh', 15],
  ['first20', 'İlk 20 dk', 'eh', 15],
  ['lot', 'Lot', 'numeric', 27],
  ['koliIc', 'Koli İç miktar', 'numeric', 12],
  ['koli', 'Koli Adedi', 'decimal', 11],
  ['nc', 'Uygunsuza Ayrılan Ürün adeti', 'numeric', 14],
  ['reason', 'Uygunsuzluk Nedeni', 'text', 23],
];
const PRINT_ROWS = 20; // kağıttaki gibi çıktı en az 20 satır

/* ---------- Kişi/ürün listeleri: JSONBin (tüm telefonlar ortak) ---------- */
// shortcut: herkese açık kutu, anahtarsız yazılıyor; ID'yi bilen herkes değiştirebilir. Gerekirse X-Access-Key'li özel kutuya geçin.
const BIN = 'https://api.jsonbin.io/v3/b/6af618ccac6210605a835b6a';
const norm = r => ({ people: Array.isArray(r?.people) ? r.people : [], products: Array.isArray(r?.products) ? r.products : [] });
let db = norm(load('db', null)); // internet yoksa son çekilen liste

async function pull() {
  const res = await fetch(BIN + '/latest', { headers: { 'X-Bin-Meta': 'false' }, cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return norm(await res.json());
}
async function sync() {
  try { db = await pull(); save('db', db); renderLists(); }
  catch { toast('İnternet yok — son kaydedilen listeler kullanılıyor'); }
}
// Önce güncel veriyi çek, değişikliği onun üstüne uygula: iki telefon aynı anda ekleyince biri silinmesin
async function mutate(fn) {
  try {
    const d = await pull();
    fn(d);
    d.people.sort((a, b) => a.localeCompare(b, 'tr'));
    d.products.sort((a, b) => a.code.localeCompare(b.code, 'tr', { numeric: true }));
    const res = await fetch(BIN, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    db = d; save('db', db); renderLists(); toast('Kaydedildi');
    return true;
  } catch (e) { toast('Kaydedilemedi (' + e.message + ') — interneti kontrol edin'); return false; }
}

function renderLists() {
  $('#personList').innerHTML = db.people.map(p => `<li>${esc(p)}<button data-del-person="${esc(p)}">Sil</button></li>`).join('') || '<li>Henüz kişi yok</li>';
  $('#productList').innerHTML = db.products.map(p => `<li><span><b>${esc(p.code)}</b> — ${esc(p.name)}</span><button data-del-product="${esc(p.code)}">Sil</button></li>`).join('') || '<li>Henüz ürün yok</li>';
}
async function busy(btn, job) { btn.disabled = true; try { return await job(); } finally { btn.disabled = false; } }

$('#personForm').onsubmit = async e => {
  e.preventDefault();
  const names = e.target.elements.v.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (await busy(e.submitter, () => mutate(d => { d.people = [...new Set([...d.people, ...names])]; }))) e.target.reset();
};
$('#productForm').onsubmit = async e => {
  e.preventDefault();
  const f = e.target.elements, code = f.code.value.trim(), name = f.pname.value.trim();
  // aynı kod varsa adı güncellenir
  if (await busy(e.submitter, () => mutate(d => { d.products = d.products.filter(p => p.code !== code).concat({ code, name }); }))) {
    e.target.reset(); f.code.focus();
  }
};
document.addEventListener('click', e => {
  const d = e.target.dataset;
  if (d.delPerson && confirm(`"${d.delPerson}" silinsin mi?`)) mutate(x => { x.people = x.people.filter(p => p !== d.delPerson); });
  if (d.delProduct && confirm(`"${d.delProduct}" kodlu ürün silinsin mi?`)) mutate(x => { x.products = x.products.filter(p => p.code !== d.delProduct); });
});

/* ---------- Form (telefonda saklanır) ---------- */
const blank = () => ({ people: [], ...Object.fromEntries(COLS.map(c => [c[0], ''])) });
const newForm = () => ({ date: today(), note: '', rows: [blank()] });
let form = load('form', null) || newForm();
let pendingFile = null; // paylaşım izni zaman aşımına uğrarsa hazır PDF
const saveForm = () => { save('form', form); pendingFile = null; $('#pdf').textContent = 'PDF İndir'; };

const inp = (r, i, k, t) =>
  `<input data-i="${i}" data-k="${k}" ${t !== 'text' ? `inputmode="${t}"` : ''} value="${esc(r[k])}" autocomplete="off">`;
const seg = (r, i, k) => `<div class="seg">${['Evet', 'Hayır'].map(v =>
  `<button type="button" data-i="${i}" data-k="${k}" data-v="${v}" class="${r[k] === v ? 'on' : ''}">${v}</button>`).join('')}</div>`;

function renderRows() {
  $('#rows').innerHTML = form.rows.map((r, i) => `
    <div class="card">
      <div class="card-top">Satır ${i + 1}<button type="button" data-del-row="${i}">Satırı sil</button></div>
      <div class="f">
        <label class="full">Kişi<button type="button" class="who" data-i="${i}">${esc(r.people.join(', '))}</button></label>
        <div class="code-wrap">
          <label>Ürün kodu${inp(r, i, 'code', 'numeric')}</label>
          <label>Ürün adı${inp(r, i, 'name', 'text')}</label>
        </div>
        <label>Sağlam Ürün Adeti${inp(r, i, 'ok', 'numeric')}</label>
        <label>Lot${inp(r, i, 'lot', 'numeric')}</label>
        <label>%100 Ayıklama${seg(r, i, 'sort')}</label>
        <label>İlk 20 dk${seg(r, i, 'first20')}</label>
        <label>Koli İç Miktar${inp(r, i, 'koliIc', 'numeric')}</label>
        <label>Koli Adedi${inp(r, i, 'koli', 'decimal')}</label>
        <label>Uygunsuz Ürün Adeti${inp(r, i, 'nc', 'numeric')}</label>
        <label>Uygunsuzluk Nedeni${inp(r, i, 'reason', 'text')}</label>
      </div>
    </div>`).join('');
}

/* Ürün seçme listesi: kod ya da ad yazdıkça süzülür, kaydırılabilir */
const dd = document.createElement('ul');
dd.id = 'dd';
dd.hidden = true;
const isProdInput = el => el.dataset?.k === 'code' || el.dataset?.k === 'name';
function openDD(el) {
  el.closest('.code-wrap').appendChild(dd);
  const q = lower(el.value.trim());
  const list = db.products.filter(p => !q || p.code.startsWith(q) || lower(p.name).includes(q));
  dd.dataset.i = el.dataset.i;
  dd.innerHTML = list.map(p => `<li data-code="${esc(p.code)}"><b>${esc(p.code)}</b><span>${esc(p.name)}</span></li>`).join('')
    || `<li class="empty">${db.products.length ? 'Eşleşen ürün yok' : 'Önce “Ürünler” sekmesinden ürün ekleyin'}</li>`;
  dd.hidden = false;
  dd.scrollTop = 0;
}
dd.addEventListener('mousedown', e => e.preventDefault()); // dokununca yazı kutusu odağı kaybetmesin
dd.addEventListener('click', e => {
  const li = e.target.closest('li[data-code]');
  if (!li) return;
  const p = db.products.find(p => p.code === li.dataset.code), r = form.rows[dd.dataset.i];
  const card = dd.closest('.card');
  r.code = p.code; r.name = p.name;
  card.querySelector('[data-k=code]').value = p.code;
  card.querySelector('[data-k=name]').value = p.name;
  saveForm();
  dd.hidden = true;
  document.activeElement.blur(); // klavyeyi kapat
});
$('#rows').addEventListener('focusin', e => { if (isProdInput(e.target)) openDD(e.target); });
$('#rows').addEventListener('focusout', e => { if (isProdInput(e.target)) dd.hidden = true; });

$('#rows').addEventListener('input', e => {
  const el = e.target, i = el.dataset.i, k = el.dataset.k;
  if (i == null || !k) return;
  const r = form.rows[i];
  // Lot: 6 haneden sonra "/" otomatik (ör. 070826/0077008) — sayı klavyesinde "/" yok
  if (k === 'lot' && /^\d{7,}$/.test(el.value)) el.value = el.value.slice(0, 6) + '/' + el.value.slice(6);
  r[k] = el.value;
  if (isProdInput(el)) {
    // tam eşleşen kod/ad yazılınca karşı alan otomatik dolar
    const p = db.products.find(p => k === 'code' ? p.code === el.value.trim() : lower(p.name) === lower(el.value.trim()));
    const other = k === 'code' ? 'name' : 'code';
    if (p) { r[other] = p[other]; el.closest('.card').querySelector(`[data-k=${other}]`).value = p[other]; }
    openDD(el);
  }
  saveForm();
});

let pickRow = 0;
$('#rows').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const i = +b.dataset.i;
  if (b.dataset.v) { // Evet/Hayır: tekrar dokununca boşalır
    const r = form.rows[i], k = b.dataset.k;
    r[k] = r[k] === b.dataset.v ? '' : b.dataset.v;
    b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === r[k]));
    saveForm();
  } else if (b.classList.contains('who')) {
    pickRow = i;
    const sel = form.rows[i].people;
    $('#pickList').innerHTML = db.people.length
      ? db.people.map(p => `<label><input type="checkbox" value="${esc(p)}" ${sel.includes(p) ? 'checked' : ''}>${esc(p)}</label>`).join('')
      : '<p>Önce “Kişiler” sekmesinden kişi ekleyin.</p>';
    $('#pick').returnValue = '';
    $('#pick').showModal();
  } else if (b.dataset.delRow != null && confirm(`Satır ${+b.dataset.delRow + 1} silinsin mi?`)) {
    form.rows.splice(b.dataset.delRow, 1);
    if (!form.rows.length) form.rows.push(blank());
    saveForm(); renderRows();
  }
});
$('#pick').addEventListener('close', () => {
  if ($('#pick').returnValue !== 'ok') return;
  form.rows[pickRow].people = [...$('#pickList').querySelectorAll(':checked')].map(x => x.value);
  saveForm(); renderRows();
});

function fillHeader() { $('#date').value = form.date; $('#note').value = form.note; }
$('#date').onchange = e => { form.date = e.target.value; saveForm(); };
$('#note').oninput = e => { form.note = e.target.value; saveForm(); };
$('#addRow').onclick = () => {
  form.rows.push(blank()); saveForm(); renderRows();
  $('#rows').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'start' });
};
$('#clear').onclick = () => {
  if (!confirm('Form temizlensin mi? (Kişi ve ürün listeleri silinmez)')) return;
  form = newForm(); saveForm(); fillHeader(); renderRows();
};

/* ---------- Çıktı ---------- */
function sheet() {
  const box = on => `<span class="cb">${on ? 'X' : ''}</span>`;
  const td = (r, [k, , t]) => t === 'eh'
    ? `<td class="eh">${box(r[k] === 'Evet')}Evet<br>${box(r[k] === 'Hayır')}Hayır</td>`
    : `<td>${esc(r[k])}</td>`;
  const rows = [...form.rows];
  while (rows.length < PRINT_ROWS) rows.push(blank());
  return `<div class="sheet">
    <h1>${trDate(form.date)}<span>-MONTAJ-</span></h1>
    <table>
      <colgroup><col style="width:20mm">${COLS.map(c => `<col style="width:${c[3]}mm">`).join('')}</colgroup>
      <thead><tr><th>Kişi</th>${COLS.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.people.join(', '))}</td>${COLS.map(c => td(r, c)).join('')}</tr>`).join('')}</tbody>
    </table>
    <p class="note">${esc(form.note).replace(/\n/g, '<br>')}</p>
  </div>`;
}
const fillPrint = () => $('#print').innerHTML = sheet();
window.addEventListener('beforeprint', fillPrint);
$('#printBtn').onclick = () => { fillPrint(); window.print(); };

function download(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function share(file) {
  try { await navigator.share({ files: [file], title: file.name }); }
  catch (e) {
    if (e.name === 'NotAllowedError') { // PDF uzun sürdüyse tarayıcı paylaşımı engeller: bir dokunuş daha iste
      pendingFile = file; $('#pdf').textContent = 'Paylaş'; toast('PDF hazır — paylaşmak için tekrar dokunun');
    } else if (e.name !== 'AbortError') download(file);
  }
}
$('#pdf').onclick = async () => {
  if (pendingFile) { const f = pendingFile; pendingFile = null; $('#pdf').textContent = 'PDF İndir'; return share(f); }
  if (!window.html2pdf) return toast('PDF kütüphanesi yüklenemedi (internet?) — “Yazdır” ile kaydedin');
  const b = $('#pdf'); b.disabled = true; b.textContent = 'Hazırlanıyor…';
  let file;
  try {
    const blob = await html2pdf().set({
      margin: 8,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, windowWidth: 800 }, // dar ekran düzeni çıktıyı bozmasın
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css'] },
    }).from(sheet()).outputPdf('blob');
    file = new File([blob], `Montaj_${trDate(form.date) || 'form'}.pdf`, { type: 'application/pdf' });
  } catch (err) { toast('PDF oluşturulamadı: ' + err.message); }
  b.disabled = false; b.textContent = 'PDF İndir';
  if (!file) return;
  if (navigator.canShare?.({ files: [file] })) await share(file); else download(file);
};

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== b.dataset.tab);
  $('#bottom').hidden = b.dataset.tab !== 'form';
});

fillHeader();
renderLists();
renderRows();
sync();
</script>
</body>
</html>
